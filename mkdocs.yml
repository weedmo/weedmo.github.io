site_name: Rokey Study Notes
site_description: ROS2 & AI Study Materials
site_url: "https://weedmo.github.io/"

theme:
  name: material
  language: ko
  palette:
    scheme: default
    primary: blue
    accent: indigo
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - ROS:
    - ros/index.md
    - "\uC785\uBB38 (Introduction)":
      - "1\uCC28\uC2DC - ROS2 \uAC1C\uC694": ros/intro/lesson-01.md
